<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neovim Caster Studio</title>
  <style>
    :root {
      color-scheme: dark;
      --accent: #a6e3a1;
      --accent-bright: #c8f7c5;
      --folder: #89b4fa;
      --text: #e6e9ef;
      --muted: #8b93a7;
      --panel-opacity: .80;
      --row-height: 22px;
      --panel-width: 300px;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      padding: 0;
      color: var(--text);
      font-family: "SFMono-Regular", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    }

    .panel {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(var(--panel-width), 100vw);
      min-width: min(220px, 100vw);
      max-width: 100vw;
      height: 100vh;
      overflow: hidden;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .075);
      border-left: 0;
      border-radius: 0 7px 7px 0;
      background: rgba(17, 18, 27, var(--panel-opacity));
      box-shadow: 12px 0 35px rgba(0, 0, 0, .25), inset 0 1px rgba(255, 255, 255, .035);
      opacity: 0;
      transform: translateY(8px) scale(.985);
      transition: opacity 220ms ease, transform 220ms cubic-bezier(.2, .8, .2, 1);
    }

    .panel.connected {
      opacity: 1;
      transform: none;
    }

    header {
      display: flex;
      align-items: center;
      flex: 0 0 27px;
      gap: 7px;
      min-width: 0;
      padding: 0 7px;
      border-bottom: 1px solid rgba(255, 255, 255, .075);
    }

    .status {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px rgba(166, 227, 161, .72);
      transition: background 180ms ease, box-shadow 180ms ease;
    }

    .status.disconnected {
      background: #f38ba8;
      box-shadow: 0 0 7px rgba(243, 139, 168, .65);
    }

    .project-name {
      overflow: hidden;
      color: #eef1f6;
      font-size: 11px;
      font-weight: 750;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tree {
      display: grid;
      grid-template-rows: repeat(var(--entry-count, 1), minmax(0, var(--row-height)));
      align-content: start;
      flex: 1 1 auto;
      min-height: 0;
      margin: 0;
      padding: 2px 2px 2px 3px;
      overflow: hidden;
      list-style: none;
    }

    .entry {
      --depth: 0;
      position: relative;
      display: flex;
      align-items: center;
      min-width: 0;
      height: 100%;
      margin: 0;
      padding: 0 5px 0 calc(2px + var(--depth) * 11px);
      border-radius: 5px;
      color: #c9ceda;
      font-size: 10.5px;
      line-height: 1;
      transform-origin: left center;
      transition: color 170ms ease, background 170ms ease, transform 200ms cubic-bezier(.2, .9, .2, 1);
      will-change: transform, background-color;
    }

    .entry::before {
      content: "├─";
      width: 17px;
      flex: 0 0 auto;
      color: rgba(139, 147, 167, .48);
      letter-spacing: -3px;
    }

    .entry.directory { color: var(--folder); }
    .entry.directory::after {
      content: "/";
      color: rgba(137, 180, 250, .56);
    }

    .entry.directory.unlisted::after {
      content: "/ …";
    }

    .entry.active {
      z-index: 2;
      color: var(--accent-bright);
      background: linear-gradient(90deg, rgba(166, 227, 161, .17), rgba(166, 227, 161, .045));
      box-shadow: inset 2px 0 var(--accent);
      transform: translateX(1px) scale(1.025);
      font-weight: 750;
    }

    .entry.active::before { color: var(--accent); }

    .entry.omission {
      height: 100%;
      color: var(--muted);
      font-size: 8px;
      font-style: italic;
    }

    .entry.omission::before { content: "⋮ "; letter-spacing: normal; }

    .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .forced .name::after {
      content: "  (outside scan)";
      color: var(--muted);
      font-size: 8px;
      font-weight: 400;
    }

    .width-resizer {
      position: absolute;
      z-index: 10;
      top: 0;
      right: 0;
      width: 9px;
      height: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: ew-resize;
      touch-action: none;
    }

    .width-resizer::after {
      position: absolute;
      top: 8px;
      right: 2px;
      bottom: 8px;
      width: 2px;
      border-radius: 2px;
      background: rgba(255, 255, 255, .12);
      content: "";
      opacity: 0;
      transition: opacity 150ms ease, background 150ms ease;
    }

    .width-resizer:hover::after,
    .width-resizer:focus-visible::after,
    .width-resizer.dragging::after {
      background: var(--accent);
      opacity: .8;
    }

    .width-resizer:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: -2px;
    }


    @media (max-height: 320px) {
      :root { --row-height: 19px; }
      .entry { font-size: 9.5px; }
    }
  </style>
</head>
<body>
  <main class="panel" id="panel" aria-live="polite">
    <header>
      <span class="status" id="status" aria-label="Connected"></span>
      <span class="project-name" id="project-name"></span>
    </header>
    <ol class="tree" id="tree"></ol>
    <button
      class="width-resizer"
      id="width-resizer"
      type="button"
      aria-label="Resize project tree width"
      role="separator"
      aria-orientation="vertical"
      aria-valuemin="220"
      title="Drag to resize"
    ></button>
  </main>

  <script>
    const panel = document.getElementById('panel');
    const tree = document.getElementById('tree');
    const status = document.getElementById('status');
    const projectName = document.getElementById('project-name');
    const widthResizer = document.getElementById('width-resizer');
    let previousPosition = null;
    let firstRender = true;
    let lastSignature = '';
    let events = null;
    let visibleRows = null;
    let panelWidth = 300;
    try {
      panelWidth = Number(localStorage.getItem('caster-panel-width')) || panelWidth;
    } catch (_) {}
    function makeRow(entry) {
      const row = document.createElement('li');
      row.className = `entry ${entry.kind}${entry.active ? ' active' : ''}${entry.unlisted ? ' unlisted' : ''}`;
      row.style.setProperty('--depth', entry.depth || 0);
      row.dataset.position = entry.position || '';
      row.dataset.path = entry.path;

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = entry.name;
      row.append(name);
      return row;
    }

    function animateTravel(fromPosition, nextPosition) {
      if (firstRender || fromPosition == null || nextPosition == null || fromPosition === nextPosition) return;

      const direction = nextPosition > fromPosition ? 1 : -1;
      let rows = [...tree.querySelectorAll('.entry:not(.omission)')].filter((row) => {
        const position = Number(row.dataset.position);
        return direction > 0
          ? position > fromPosition && position <= nextPosition
          : position < fromPosition && position >= nextPosition;
      });

      if (!rows.length) rows = [...tree.querySelectorAll('.entry:not(.omission)')];
      rows.sort((a, b) => direction * (Number(a.dataset.position) - Number(b.dataset.position)));

      const step = Math.max(13, Math.min(42, 430 / Math.max(1, rows.length)));
      rows.forEach((row, index) => {
        row.animate([
          { transform: 'translateX(0) scale(1)', offset: 0 },
          { transform: 'translateX(5px) scale(1.065)', backgroundColor: 'rgba(137, 180, 250, .14)', offset: .48 },
          { transform: row.classList.contains('active') ? 'translateX(1px) scale(1.025)' : 'translateX(0) scale(1)', offset: 1 },
        ], {
          duration: 300,
          delay: index * step,
          easing: 'cubic-bezier(.2,.8,.2,1)',
        });
      });
    }

    function render(state) {
      panel.classList.add('connected');
      status.classList.remove('disconnected');
      status.setAttribute('aria-label', 'Connected');
      panel.style.setProperty('--panel-opacity', state.opacity ?? .8);

      const entries = state.entries || [];
      const signature = JSON.stringify([
        state.root,
        state.opacity,
        state.root_unlisted,
        state.active_path,
        entries.map((entry) => [entry.path, entry.active, entry.position, entry.unlisted]),
      ]);
      if (signature === lastSignature) return;
      lastSignature = signature;

      projectName.textContent = `${state.root_name || 'Project'}${state.root_unlisted ? ' …' : ''}`;
      tree.style.setProperty('--entry-count', Math.max(1, entries.length));
      tree.replaceChildren(...entries.map(makeRow));
      const fromPosition = previousPosition;
      requestAnimationFrame(() => animateTravel(fromPosition, state.active_position));
      previousPosition = state.active_position;
      firstRender = false;
    }

    function applyPanelWidth() {
      const width = Math.max(220, Math.min(panelWidth, window.innerWidth));
      panel.style.setProperty('--panel-width', `${width}px`);
      widthResizer.setAttribute('aria-valuenow', String(Math.round(width)));
    }

    function savePanelWidth() {
      try {
        localStorage.setItem('caster-panel-width', String(Math.round(panelWidth)));
      } catch (_) {}
    }

    function resizePanel(clientX) {
      panelWidth = Math.max(220, Math.min(clientX, window.innerWidth));
      applyPanelWidth();
    }

    widthResizer.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      widthResizer.setPointerCapture(event.pointerId);
      widthResizer.classList.add('dragging');
      resizePanel(event.clientX);
    });
    widthResizer.addEventListener('pointermove', (event) => {
      if (widthResizer.hasPointerCapture(event.pointerId)) resizePanel(event.clientX);
    });
    widthResizer.addEventListener('pointerup', (event) => {
      widthResizer.releasePointerCapture(event.pointerId);
      widthResizer.classList.remove('dragging');
      savePanelWidth();
    });
    widthResizer.addEventListener('pointercancel', () => {
      widthResizer.classList.remove('dragging');
    });
    widthResizer.addEventListener('keydown', (event) => {
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
      event.preventDefault();
      panelWidth += event.key === 'ArrowRight' ? 10 : -10;
      resizePanel(panelWidth);
      savePanelWidth();
    });

    function rowCapacity() {
      const styles = getComputedStyle(tree);
      const available = tree.clientHeight
        - parseFloat(styles.paddingTop)
        - parseFloat(styles.paddingBottom);
      const rowHeight = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--row-height'));
      return Math.max(3, Math.floor(available / rowHeight));
    }

    function connectForViewport() {
      const capacity = rowCapacity();
      if (capacity === visibleRows && events) return;
      visibleRows = capacity;
      if (events) events.close();
      events = new EventSource(`/events?max_entries=${capacity}`);
      events.onmessage = (event) => render(JSON.parse(event.data));
      events.onerror = () => {
        status.classList.add('disconnected');
        status.setAttribute('aria-label', 'Disconnected');
      };
      events.onopen = () => {
        status.classList.remove('disconnected');
        status.setAttribute('aria-label', 'Connected');
      };
    }

    applyPanelWidth();
    new ResizeObserver(() => {
      applyPanelWidth();
      connectForViewport();
    }).observe(document.body);
    connectForViewport();


  </script>
</body>
</html>
